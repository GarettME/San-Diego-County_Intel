# ─────────────────────────────────────────────────────────────────────────────
# SD County Motivated Seller Lead Scraper — GitHub Actions Workflow
#
# Source : San Diego County ARCC "Official Records" (AcclaimWeb), updated daily.
# Method : Playwright drives the recorder portal and scrapes distress filings
#          (Notice of Default, Lis Pendens, tax/judgment liens, probate, …).
# Schedule: every day at 06:00 UTC. Also manually triggerable.
#
# IMPORTANT — the SD portal is behind Akamai bot protection that blocks
# datacenter IPs (incl. GitHub runners). Add a residential proxy as repo
# secrets so the run can reach it:
#   Settings → Secrets and variables → Actions →
#     PROXY_SERVER    e.g. http://gate.smartproxy.com:7000
#     PROXY_USERNAME  your proxy user
#     PROXY_PASSWORD  your proxy pass
# Without a working proxy the scraper FAILS the job (exit 1) instead of
# committing stale data.
#
# Outputs (committed back to the repo so GitHub Pages serves the dashboard):
#   data/output.json     lead data
#   docs/index.html      dashboard
# ─────────────────────────────────────────────────────────────────────────────
name: Scrape SD County Leads

on:
  # NOTE: the scheduled trigger is intentionally disabled. GitHub-hosted runners
  # use datacenter IPs, which the SD County portal (Akamai) 403s — so this job
  # can only succeed from a residential IP. Scheduling now runs via local cron
  # on Garett's machine (scripts/run_daily.sh). Kept here for manual dispatch
  # and documentation; re-enable the schedule only with a residential runner.
  # schedule:
  #   - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable verbose logging (DEBUG=true)"
        required: false
        default: "false"
        type: boolean
      lookback_days:
        description: "Recording-date window in days"
        required: false
        default: "7"
        type: string

jobs:
  scrape:
    name: Run Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write          # commit results back to the repo

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # ── 4. Output directories ──────────────────────────────────────────────
      - name: Create output directories
        run: mkdir -p data docs

      # ── 5. Run the scraper ─────────────────────────────────────────────────
      - name: Run scraper
        env:
          DEBUG:         ${{ github.event.inputs.debug_mode || 'false' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          PROXY_SERVER:   ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python src/scraper.py

      # ── 6. Validate output ─────────────────────────────────────────────────
      - name: Validate JSON output
        run: |
          python -c "
          import json
          with open('data/output.json') as f:
              data = json.load(f)
          leads = data.get('leads', [])
          assert leads, 'No leads in output.json'
          print(f'output.json valid — {len(leads)} leads')
          top = leads[0]
          print(f'   Top lead: {top.get(\"grantor\") or top.get(\"grantee\")} (score={top[\"seller_score\"]})')
          "

      # ── 7. Upload artifacts ────────────────────────────────────────────────
      - name: Upload JSON output
        uses: actions/upload-artifact@v6
        with:
          name: leads-json-${{ github.run_number }}
          path: data/output.json
          retention-days: 90

      - name: Upload dashboard
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-${{ github.run_number }}
          path: docs/index.html
          retention-days: 90

      # ── 8. Commit results back to the repo ─────────────────────────────────
      - name: Commit results to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output.json docs/index.html
          git diff --cached --quiet || \
            git commit -m "chore: update leads data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      # ── 9. Job summary ─────────────────────────────────────────────────────
      - name: Print run summary
        if: always()
        run: |
          echo "## SD County Leads Scraper Results" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json, os
          try:
              with open('data/output.json') as f:
                  data = json.load(f)
              leads = data.get('leads', [])
              high  = [l for l in leads if l['seller_score'] >= 70]
              med   = [l for l in leads if 40 <= l['seller_score'] < 70]
              low   = [l for l in leads if l['seller_score'] < 40]
              out = os.getenv('GITHUB_STEP_SUMMARY')
              with open(out, 'a') as s:
                  s.write('| Metric | Value |\n|--------|-------|\n')
                  s.write(f'| Total leads | {len(leads)} |\n')
                  s.write(f'| High score (>=70) | {len(high)} |\n')
                  s.write(f'| Medium score (40-69) | {len(med)} |\n')
                  s.write(f'| Low score (<40) | {len(low)} |\n')
                  s.write(f'| Source | {data.get(\"source\",\"?\")} |\n')
                  s.write(f'| Generated at | {data.get(\"generated_at\",\"unknown\")} |\n')
          except Exception as e:
              with open(os.getenv('GITHUB_STEP_SUMMARY'), 'a') as s:
                  s.write(f'| Error | {e} |\n')
          "
